[package]
name = "chainid-kiosk"
version = "1.0.0"
edition = "2021"
description = "ChainID Secure Registration Kiosk Protocol"
authors = ["grasshaussoftware <deusopus@duck.com>"]

[dependencies]
# Web3 & Blockchain
ethers = { version = "2.0", features = ["rustls"] }

# Cryptography & Keys
coins-bip39 = "0.8"     # BIP-39 mnemonic generation
sha2 = "0.10"           # SHA-256 hashing
hmac = "0.12"           # HMAC for salted/peppered hashing
hex = "0.4"             # Hex encoding/decoding
rand = "0.8"            # Secure entropy generation

# Memory Safety
zeroize = { version = "1.6", features = ["zeroize_derive"] }

# Network & Async
tokio = { version = "1.28", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] } # For IPFS pinning API

# Utilities & Formatting
qrcode = "0.13"         # Terminal QR code rendering
serde_json = "1.0"      # JSON metadata construction
chrono = "0.4"          # UTC timestamps