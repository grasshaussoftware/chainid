[package]
name = "chainid-kiosk"
version = "1.0.0"
edition = "2021"
description = "A secure kiosk daemon for generating sovereign digital identities. Privacy-first, zero-knowledge, hardware-secured."
authors = ["deusopus <deusopus@duck.com>"]

[dependencies]
ethers = { version = "2.0", features = ["rustls"] }
tokio = { version = "1.36", features = ["full"] }
serde_json = "1.0"
chrono = "0.4"
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
qrcode = "0.12"
hex = "0.4"
tss-esapi = "7.2"